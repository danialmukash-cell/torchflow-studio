name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: FastAPI reference
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run unit and real PyTorch CPU tests
        run: pytest -q

  rust:
    name: Rust backend and PyTorch export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and check Rust
        working-directory: backend-rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          cargo +stable fmt --check
          cargo +stable clippy --locked --all-targets -- -D warnings
          cargo +stable test --locked
          cargo +stable build --locked
      - name: Install contract and CPU test dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt pytest httpx
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run API contract and real PyTorch CPU tests against Rust
        working-directory: backend
        env:
          TORCHFLOW_TEST_API_URL: http://127.0.0.1:8000
        run: |
          ../backend-rust/target/debug/torchflow-server > /tmp/torchflow-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fs "$TORCHFLOW_TEST_API_URL/api/health" > /dev/null; then break; fi
            sleep 1
          done
          if ! curl -fs "$TORCHFLOW_TEST_API_URL/api/health" > /dev/null; then
            cat /tmp/torchflow-server.log
            exit 1
          fi
          pytest -q tests/test_health.py tests/test_validate.py tests/test_generate.py tests/test_roundtrip_execution.py
